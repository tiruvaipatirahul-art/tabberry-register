<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabberry Register</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#242323;background:#f7f5f1}*{box-sizing:border-box}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #ded9d4;background:white;border-radius:9px;padding:10px;color:#292525}button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:default}.primary{background:#873f42;border-color:#873f42;color:white;font-weight:700}.shell{height:100dvh;min-height:620px;display:flex;flex-direction:column}.top{height:62px;background:#262424;color:white;display:flex;justify-content:space-between;align-items:center;padding:10px 18px}.logo{font-size:23px;font-weight:800;letter-spacing:-1px}.logo b{color:#dc9c9c}.top small{color:#d2c6c4}.app{display:grid;grid-template-columns:76px minmax(300px,1fr) minmax(300px,35%);min-height:0;flex:1}.side{background:#302c2b;padding:12px 7px;display:flex;flex-direction:column;gap:9px}.side button{background:transparent;border:0;color:#d8d0cd;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;padding:10px 2px}.side button.active{background:#873f42;color:white}.side .bottom{margin-top:auto}.center{overflow:auto;padding:18px}.bill{background:#fff;border-left:1px solid #e7e0dc;padding:18px;display:flex;flex-direction:column;overflow:auto}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{font-size:12px;color:#807977}.title{font-size:20px;font-weight:750;margin:0}.search{width:100%;padding:14px;border:1px solid #dcd5d0;border-radius:10px;margin:14px 0;background:white}.cats{display:flex;gap:7px;overflow:auto;margin-bottom:15px}.cats button{white-space:nowrap;font-size:12px;padding:9px}.cats button.active{background:#873f42;color:white}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.product{text-align:left;min-height:120px;padding:12px;display:flex;flex-direction:column;gap:6px}.product .emoji{font-size:28px}.product .name{font-size:12px;font-weight:650;flex:1}.product .price{font-weight:750;font-size:14px}.line{border-bottom:1px solid #e9e5e1;padding:12px 0}.qty{display:flex;align-items:center;gap:8px}.qty button{padding:4px 10px}.billitems{flex:1;min-height:80px}.billfooter{border-top:1px solid #e7e0dc;padding-top:14px;display:grid;gap:10px}.total{font-size:24px;font-weight:800}.wide{width:100%}.pill{border-radius:20px;background:#f1e7e5;color:#873f42;font-size:11px;padding:5px 9px}.card{background:#fff;border:1px solid #e4ddd8;border-radius:12px;padding:16px;margin:12px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{width:100%;border:1px solid #dcd5d0;border-radius:9px;padding:12px;margin:8px 0;background:white}.overlay{position:fixed;inset:0;background:#171414a8;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}.modal{background:#fff;border-radius:16px;padding:23px;width:min(440px,100%);max-height:90vh;overflow:auto}.modal h2{margin:0 0 10px}.modal p{color:#746d6a;font-size:13px;line-height:1.5}.modal label{display:block;font-size:13px;margin-top:10px}.pin{display:flex;justify-content:center;gap:10px;margin:20px 0}.pin span{border:1px solid #ddd4ce;width:43px;height:49px;border-radius:9px;display:grid;place-items:center;font-size:22px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:250px;margin:auto}.keypad button{height:55px;font-size:20px}.login{height:100dvh;min-height:520px;display:grid;place-items:center;background:#f7f5f1}.loginbox{text-align:center;background:white;padding:30px;border-radius:18px;box-shadow:0 12px 50px #31242415;width:min(380px,95vw)}.loginbox .logo{color:#242424}.alert{color:#9a2d37;font-size:12px;margin:8px 0}.success{color:#25784d;font-size:12px}.note{background:#faf1ed;border:1px solid #e9cfc8;padding:12px;border-radius:9px;font-size:12px}.navview{max-width:760px;margin:auto}.saveditem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 0;border-bottom:1px solid #eee}.receipt{max-width:390px;margin:auto;border:1px dashed #aaa;padding:22px;background:white}.receipt .row{margin:10px 0}.hidden{display:none!important}@media(max-width:800px){.app{grid-template-columns:58px minmax(220px,1fr) minmax(230px,39%)}.center,.bill{padding:10px}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.side button{font-size:9px}.top{padding:10px}}@media(max-width:540px){.shell{height:auto;min-height:100dvh}.app{grid-template-columns:52px minmax(0,1fr) minmax(155px,40%);min-height:calc(100dvh - 62px)}.center,.bill{padding:8px}.products{grid-template-columns:1fr}.product{min-height:93px;padding:9px}.product .emoji{font-size:21px}.title{font-size:15px}.bill .row{gap:4px}.billfooter button{padding:9px 3px;font-size:11px}.side{padding:6px 2px}.side button{font-size:8px}.top small{font-size:10px}}
</style></head><body><div id="root"><div class="login"><div class="loginbox"><div class="logo">tabberry<b>.</b></div><p class="muted">Employee sign in</p><h2>Enter 4-digit PIN</h2><div id="pin" class="pin"><span>–</span><span>–</span><span>–</span><span>–</span></div><div id="pinerror" class="alert"></div><div class="keypad" id="keys"><button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button><button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button><button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button><button type="button" data-key="⌫">⌫</button><button type="button" data-key="0">0</button><button type="button" data-key="✓">✓</button></div><p class="muted">Demo PIN: <strong>1234</strong></p></div></div></div><script>
(function(){'use strict';const $=s=>document.querySelector(s),root=$('#root');const money=n=>'$'+n.toFixed(2),escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const products=[['milk','Whole Milk · 1 gal',4.29,'Grocery','🥛','1001'],['eggs','Large Eggs · 12 ct',3.89,'Grocery','🥚','1002'],['bread','Sandwich Bread',2.99,'Grocery','🍞','1003'],['chips','Potato Chips',3.49,'Snacks','🥔','1004'],['soda','Cola · 12 pack',7.99,'Beverages','🥤','1005'],['vodka','Vodka · 750 ml',21.99,'Liquor','🍸','1006'],['beer','Beer · 6 pack',10.99,'Liquor','🍺','1007'],['wine','Red Wine · 750 ml',15.99,'Liquor','🍷','1008'],['banana','Bananas',.79,'Produce','🍌','4011'],['apple','Honeycrisp Apples',2.49,'Produce','🍎','4012'],['tomato','Tomatoes',1.99,'Produce','🍅','4013']].map(([id,name,price,cat,icon,code])=>({id,name,price,cat,icon,code,age:cat==='Liquor',weighed:cat==='Produce'}));let logged=false,pin='',view='sale',cat='All',search='',cart=[],customer=null,saved=[],saleId=1001,verified=false,modal='',payment='cash',tender='',error='',ageChecked=false,receipt=null,settings='General',points=325;const sub=()=>cart.reduce((a,l)=>a+l.price*l.qty,0),tax=()=>cart.reduce((a,l)=>a+(l.cat==='Produce'||l.cat==='Grocery'?0:l.price*l.qty*.06),0),total=()=>Math.round((sub()+tax()-(customer&&customer.redeem?5:0))*100)/100,hasAge=()=>cart.some(l=>l.age);function login(){root.innerHTML=`<div class="login"><div class="loginbox"><div class="logo">tabberry<b>.</b></div><p class="muted">MAIN STREET MARKET · REGISTER 01</p><h2>Employee PIN</h2><div class="pin">${[0,1,2,3].map(i=>`<span>${pin.length>i?'●':'–'}</span>`).join('')}</div><div class="alert">${escape(error)}</div><div class="keypad">${['1','2','3','4','5','6','7','8','9','⌫','0','✓'].map(k=>`<button data-key="${k}">${k}</button>`).join('')}</div><p class="muted">Demo PIN: <strong>1234</strong></p></div></div>`}function shell(){root.innerHTML=`<div class="shell"><header class="top"><div class="logo">tabberry<b>.</b></div><div style="text-align:right"><div>Main Street Market</div><small>Register 01 · Alex · Sale #${saleId}</small></div></header><div class="app"><aside class="side">${[['sale','🛒','Sale'],['bills','🧾','Bills'],['customers','👤','Loyalty'],['history','🕒','History'],['returns','↩','Returns'],['settings','⚙','Settings'],['lock','🔒','Lock']].map(([v,icon,label])=>`<button data-nav="${v}" class="${view===v?'active':''} ${v==='lock'?'bottom':''}"><span style="font-size:21px">${icon}</span>${label}</button>`).join('')}</aside><main class="center" id="center"></main><section class="bill" id="bill"></section></div></div><div id="overlay"></div>`;renderView();renderBill()}function render(){if(!logged)login();else shell()}function renderView(){let c=$('#center');if(!c)return;if(view==='sale'){let filtered=products.filter(p=>(cat==='All'||p.cat===cat)&&(!search||p.name.toLowerCase().includes(search.toLowerCase())||p.code.includes(search)));c.innerHTML=`<div class="row"><h2 class="title">New sale</h2><span class="pill">Register 01</span></div><input class="search" id="search" placeholder="Scan barcode, search name or PLU" value="${escape(search)}"><div class="cats">${['All','Grocery','Produce','Liquor','Snacks','Beverages'].map(x=>`<button data-cat="${x}" class="${cat===x?'active':''}">${x}</button>`).join('')}</div><div class="products">${filtered.map(p=>`<button class="product" data-product="${p.id}"><span class="emoji">${p.icon}</span><span class="name">${escape(p.name)} ${p.age?'· 21+':''}</span><span class="price">${money(p.price)}${p.weighed?'/lb':''}</span></button>`).join('')}</div>${filtered.length?'':'<p class="muted">No matching items</p>'}`;return}if(view==='bills'){c.innerHTML=`<div class="navview"><h2 class="title">Saved bills · Pay later</h2><p class="muted">Resume unpaid carts at this register</p>${saved.length?saved.map(s=>`<div class="saveditem"><div><strong>${escape(s.name)}</strong><div class="muted">${s.items.length} items · ${money(s.items.reduce((a,l)=>a+l.price*l.qty,0))}</div></div><button data-resume="${s.id}" class="primary">Resume</button></div>`).join(''):'<div class="card muted">No saved bills. Use Save / Pay later from the current bill.</div>'}</div>`;return}if(view==='customers'){c.innerHTML=`<div class="navview"><h2 class="title">Customer loyalty</h2><p class="muted">Attach a customer by phone to track rewards</p><div class="card"><label>Customer phone</label><input class="field" id="customerphone" type="tel" placeholder="(248) 555-0123"><button class="primary wide" data-action="attach">Find / Attach demo customer</button></div>${customer?`<div class="card"><strong>${escape(customer.name)}</strong><p>${escape(customer.phone)} · ${points} points</p><label><input type="checkbox" id="redeem" ${customer.redeem?'checked':''}> Redeem 200 points for $5 off</label></div>`:''}</div>`;return}if(view==='settings'){c.innerHTML=`<h2 class="title">Register settings</h2><div class="cats" style="margin-top:15px">${['General','Hardware','Security','Receipts'].map(x=>`<button data-settings="${x}" class="${settings===x?'active':''}">${x}</button>`).join('')}</div><div class="card">${settings==='General'?'Store: Main Street Market<br><br>Register: 01<br><br>Cashier: Alex':settings==='Hardware'?'Barcode scanner: Demo<br><br>Weighing scale: Manual entry<br><br>Receipt printer: Not connected':settings==='Security'?'Employee PIN required<br><br>Alcohol age verification required<br><br>Manager overrides: Restricted': 'Printed receipts: Enabled<br><br>Digital receipts: Optional'}</div>`;return}c.innerHTML=`<h2 class="title">${view==='history'?'Transaction history':'Returns'}</h2><div class="card muted">${view==='history'&&receipt?'Last completed sale: #'+(saleId-1)+' · '+money(receipt.total):'No records in this demo session.'}</div>`}function renderBill(){let b=$('#bill');if(!b)return;b.innerHTML=`<div class="row"><h2 class="title">Current bill</h2><button data-action="clear" title="Clear bill">🗑</button></div><p class="muted">Sale #${saleId} · ${cart.length} line items</p><button data-action="customer" style="text-align:left;width:100%;margin:8px 0">${customer?'👤 '+escape(customer.name)+' · '+points+' pts':'＋ Attach customer / Loyalty'}</button><div class="billitems">${cart.length?cart.map(l=>`<div class="line"><div class="row"><strong style="font-size:12px">${l.icon} ${escape(l.name)}</strong><b style="font-size:13px">${money(l.price*l.qty)}</b></div><div class="row" style="margin-top:8px"><span class="muted">${l.weighed?l.qty.toFixed(2)+' lb @ '+money(l.price):money(l.price)+' each'}</span><div class="qty">${l.weighed?'<span class="muted">Weighed</span>':`<button data-minus="${l.lineId}">−</button>${l.qty}<button data-plus="${l.lineId}">+</button>`}<button data-remove="${l.lineId}">×</button></div></div></div>`).join(''):'<div class="card muted" style="text-align:center">🛒<br><br>Scan items to begin</div>'}</div>${hasAge()?`<button data-action="verify" style="text-align:left;color:${verified?'#23754c':'#9a2d37'}">${verified?'✓ Age verified':'⚠ Alcohol age verification required'}</button>`:''}<div class="billfooter"><div class="row"><span class="muted">Subtotal</span><b>${money(sub())}</b></div><div class="row"><span class="muted">Estimated tax</span><b>${money(tax())}</b></div>${customer&&customer.redeem?'<div class="row"><span class="muted">Loyalty reward</span><b>−$5.00</b></div>':''}<div class="row"><b>Total</b><span class="total">${money(Math.max(0,total()))}</span></div><button class="primary wide" data-action="pay" ${!cart.length?'disabled':''}>Pay ${money(Math.max(0,total()))}</button><button class="wide" data-action="save" ${!cart.length?'disabled':''}>Save bill / Pay later</button></div>`}function openModal(html){$('#overlay').innerHTML=`<div class="overlay"><div class="modal">${html}</div></div>`}function close(){let o=$('#overlay');if(o)o.innerHTML=''}function add(p,qty=1){if(p.weighed){openModal(`<div class="row"><h2>⚖ Weigh produce</h2><button data-close>✕</button></div><p>${p.icon} ${escape(p.name)} · ${money(p.price)} per lb · PLU ${p.code}</p><label>Weight (lb)</label><input id="weight" class="field" type="number" step="0.01" min="0.01" value="1.00"><div class="grid2"><button data-weight="0.5">0.50 lb</button><button data-weight="1">1.00 lb</button><button data-weight="1.5">1.50 lb</button><button data-weight="2">2.00 lb</button></div><p class="muted">Manual scale entry · Hardware not connected</p><div class="alert" id="modalerror"></div><button class="primary wide" data-weigh="${p.id}">Add weighed item</button>`);return}let old=cart.find(l=>l.id===p.id&&!l.weighed);if(old)old.qty+=qty;else cart.push({...p,qty,lineId:p.id});if(p.age){verified=false;ageChecked=false;renderBill();verify()}else renderBill()}function verify(){openModal(`<div class="row"><h2>🛡 Alcohol age verification</h2><button data-close>✕</button></div><p>Inspect an acceptable, unexpired government-issued ID, match it to the customer, and verify the customer is at least 21. This demo does not authenticate IDs.</p><label>ID type</label><select id="idtype" class="field"><option>Driver's license / State ID</option><option>Passport</option><option>Other acceptable ID</option></select><label><input id="ageconfirm" type="checkbox"> I checked the ID and confirmed age 21 or older</label><div class="alert" id="modalerror"></div><div class="grid2" style="margin-top:15px"><button data-action="removealcohol">Remove alcohol</button><button class="primary" data-action="confirmage">Verify age</button></div>`)}function checkout(){if(hasAge()&&!verified){verify();return}payment='cash';tender=Math.ceil(total()).toFixed(2);openModal(`<div class="row"><h2>Checkout</h2><button data-close>✕</button></div><div class="card" style="text-align:center"><div class="muted">Total due</div><div class="total">${money(total())}</div></div><div class="grid2"><button data-method="cash" class="primary">Cash</button><button data-method="card">Card (demo)</button></div><div id="payfields"><label>Cash received ($)</label><input class="field" id="tender" type="number" step="0.01" value="${tender}"></div><div id="modalerror" class="alert"></div><button class="primary wide" data-action="complete">Complete simulated payment</button>`)}function complete(){let received=payment==='cash'?Number($('#tender')?.value):total();if(payment==='cash'&&(!Number.isFinite(received)||received<total())){$('#modalerror').textContent='Enter enough cash to cover the bill.';return}if(hasAge()&&!verified){verify();return}receipt={items:cart.map(x=>({...x})),total:total(),tax:tax(),sub:sub(),payment,received};if(customer){points+=Math.floor(total());if(customer.redeem)points=Math.max(0,points-200)}cart=[];customer=null;verified=false;close();let r=receipt;openModal(`<h2 style="text-align:center">✓ Sale completed</h2><div class="receipt"><h2 style="text-align:center">tabberry.</h2><p style="text-align:center">Main Street Market · #${saleId}</p>${r.items.map(l=>`<div class="row"><span>${escape(l.name)} × ${l.qty}</span><b>${money(l.qty*l.price)}</b></div>`).join('')}<hr><div class="row"><b>Total</b><b>${money(r.total)}</b></div><div class="row"><span>Payment</span><span>${r.payment}</span></div>${r.payment==='cash'?`<div class="row"><span>Change</span><b>${money(r.received-r.total)}</b></div>`:''}</div><button class="primary wide" data-action="next" style="margin-top:14px">New sale</button>`);saleId++;renderBill()}function save(){openModal(`<div class="row"><h2>Save unpaid bill</h2><button data-close>✕</button></div><p>Preserve this cart for payment later. No payment is collected.</p><label>Bill reference</label><input class="field" id="billname" placeholder="e.g. John / Counter 2"><div class="card">${cart.length} items · ${money(total())} due</div><div class="alert" id="modalerror"></div><button class="primary wide" data-action="dosave">Save bill</button>`)}root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.key){if(d.key==='⌫')pin=pin.slice(0,-1);else if(d.key==='✓'){if(pin==='1234'){logged=true;pin='';error='';render();return}else error='Incorrect PIN. Use 1234.'}else if(pin.length<4)pin+=d.key;login();return}if(d.nav){if(d.nav==='lock'){logged=false;pin='';error='';render();return}view=d.nav;renderView();return}if(d.cat){cat=d.cat;renderView();return}if(d.product){add(products.find(p=>p.id===d.product));return}if(d.plus||d.minus){let l=cart.find(x=>x.lineId===(d.plus||d.minus));if(l){l.qty+=d.plus?1:-1;if(l.qty<=0)cart=cart.filter(x=>x!==l);if(!hasAge())verified=false;renderBill()}return}if(d.remove){cart=cart.filter(x=>x.lineId!==d.remove);if(!hasAge())verified=false;renderBill();return}if(d.close!==undefined){close();return}if(d.weight){$('#weight').value=d.weight;return}if(d.weigh){let w=Number($('#weight').value);if(!Number.isFinite(w)||w<=0){$('#modalerror').textContent='Enter a valid weight.';return}let p=products.find(x=>x.id===d.weigh);cart.push({...p,qty:Math.round(w*100)/100,lineId:p.id+'-'+Date.now()});close();renderBill();return}if(d.method){payment=d.method;for(let x of document.querySelectorAll('[data-method]'))x.classList.toggle('primary',x.dataset.method===payment);$('#payfields').innerHTML=payment==='cash'?`<label>Cash received ($)</label><input class="field" id="tender" type="number" step="0.01" value="${Math.ceil(total()).toFixed(2)}">`:'<div class="card muted">Card transaction simulated · No terminal connected</div>';return}if(d.settings){settings=d.settings;renderView();return}if(d.resume){let s=saved.find(x=>x.id==d.resume);if(cart.length){alert('Clear or save the current bill before resuming another.');return}cart=s.items.map(x=>({...x}));customer=s.customer;saved=saved.filter(x=>x.id!=d.resume);verified=false;view='sale';renderView();renderBill();if(hasAge())verify();return}let a=d.action;if(!a)return;if(a==='clear'){cart=[];verified=false;renderBill()}if(a==='customer'){view='customers';renderView()}if(a==='attach'){let phone=$('#customerphone').value.trim();if(phone.replace(/\D/g,'').length<10){alert('Enter a 10-digit phone number.');return}customer={name:'Demo Customer',phone,redeem:false};view='sale';renderView();renderBill()}if(a==='verify')verify();if(a==='removealcohol'){cart=cart.filter(x=>!x.age);verified=false;close();renderBill()}if(a==='confirmage'){if(!$('#ageconfirm').checked){$('#modalerror').textContent='Cashier confirmation is required.';return}verified=true;close();renderBill()}if(a==='pay')checkout();if(a==='complete')complete();if(a==='next'){close();view='sale';renderView();renderBill()}if(a==='save')save();if(a==='dosave'){let name=$('#billname').value.trim();if(!name){$('#modalerror').textContent='Enter a bill reference.';return}saved.unshift({id:Date.now(),name,items:cart.map(x=>({...x})),customer});cart=[];customer=null;verified=false;close();view='bills';renderView();renderBill()}});root.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let input=e.target,position=input.selectionStart;renderView();let n=$('#search');n.focus();n.setSelectionRange(position,position)}});root.addEventListener('change',e=>{if(e.target.id==='redeem'&&customer){customer.redeem=e.target.checked;renderBill()}});root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='search'){let p=products.find(p=>p.code===search.trim());if(p){add(p);search='';renderView()}}});render()})();
</script></body></html>
